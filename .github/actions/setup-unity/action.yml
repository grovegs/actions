name: Setup Unity
description: Install the Unity CLI, then install and optionally cache the Unity editor for macOS and Linux platforms with iOS and Android support.

inputs:
    project:
        description: Path to the Unity project directory
        required: false
        default: "."
    unity-version:
        description: Unity version to install with revision such as 6000.1.9f1 (ed7b183fd33d)
        required: false
        default: ""
    unity-modules:
        description: Comma-separated list of target modules to install such as ios, android
        required: false
        default: ""
    unity-child-modules:
        description: Install child modules such as the Android SDK, NDK and OpenJDK. When false, Android tools are linked from setup-android.
        required: false
        default: "false"
    unity-path:
        description: Custom directory for Unity installations (default is the Unity CLI install path)
        required: false
        default: ""
    unity-cli-channel:
        description: Release channel of the Unity CLI to install.
        required: false
        default: beta
    cache:
        description: Cache the installed Unity editor on GitHub-hosted runners. Editors are several GB, so only enable if your cache quota allows it.
        required: false
        default: "false"

outputs:
    unity-path:
        description: Root directory of Unity installation
        value: ${{ steps.install-unity.outputs.unity-path }}
    unity-executable:
        description: Path to the Unity editor executable
        value: ${{ steps.install-unity.outputs.unity-executable }}
    unity-version:
        description: Installed Unity version
        value: ${{ steps.get-unity-info.outputs.version }}

runs:
    using: composite
    steps:
        - name: ✅ Validate Platform Support
          shell: bash
          run: |
              if [[ "${RUNNER_OS}" != "macOS" && "${RUNNER_OS}" != "Linux" ]]; then
                echo "::error::This action only supports macOS and Linux. Unsupported platform: ${RUNNER_OS}"
                exit 1
              fi
              echo "::notice::Platform validation passed for ${RUNNER_OS}"

        - name: 📖 Get Unity Info
          id: get-unity-info
          shell: bash
          env:
              PROJECT_PATH: ${{ inputs.project }}
              UNITY_VERSION_INPUT: ${{ inputs.unity-version }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/get_unity_info.sh"
              "${{ github.action_path }}/scripts/get_unity_info.sh"

        - name: 🔧 Install Unity CLI
          shell: bash
          env:
              UNITY_CLI_CHANNEL: ${{ inputs.unity-cli-channel }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/install_unity_cli.sh"
              "${{ github.action_path }}/scripts/install_unity_cli.sh"

        - name: 📂 Get Install Directory
          if: inputs.cache == 'true' && runner.environment == 'github-hosted'
          id: get-install-dir
          shell: bash
          env:
              UNITY_VERSION: ${{ steps.get-unity-info.outputs.version }}
              UNITY_PATH: ${{ inputs.unity-path }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/get_install_dir.sh"
              "${{ github.action_path }}/scripts/get_install_dir.sh"

        - name: 📥 Restore Unity Editor
          if: inputs.cache == 'true' && runner.environment == 'github-hosted'
          id: restore-editor
          uses: actions/cache/restore@v6
          with:
              path: ${{ steps.get-install-dir.outputs.install-dir }}
              key: unity-editor-${{ runner.os }}-${{ runner.arch }}-${{ steps.get-unity-info.outputs.version }}-${{ steps.get-unity-info.outputs.changeset }}-${{ inputs.unity-modules }}-${{ inputs.unity-child-modules }}

        - name: ⚙️ Install Unity
          id: install-unity
          shell: bash
          env:
              UNITY_VERSION: ${{ steps.get-unity-info.outputs.version }}
              UNITY_CHANGESET: ${{ steps.get-unity-info.outputs.changeset }}
              UNITY_MODULES: ${{ inputs.unity-modules }}
              UNITY_CHILD_MODULES: ${{ inputs.unity-child-modules }}
              UNITY_PATH: ${{ inputs.unity-path }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/install_unity.sh"
              "${{ github.action_path }}/scripts/install_unity.sh"

        - name: 💾 Save Unity Editor
          if: inputs.cache == 'true' && runner.environment == 'github-hosted' && steps.restore-editor.outputs.cache-hit != 'true'
          uses: actions/cache/save@v6
          with:
              path: ${{ steps.get-install-dir.outputs.install-dir }}
              key: ${{ steps.restore-editor.outputs.cache-primary-key }}

        - name: 📱 Configure Android Tools
          if: contains(inputs.unity-modules, 'android') && inputs.unity-child-modules != 'true'
          shell: bash
          env:
              UNITY_VERSION: ${{ steps.get-unity-info.outputs.version }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/install_android_tools.sh"
              "${{ github.action_path }}/scripts/install_android_tools.sh"
