name: Check Pull Request Title
description: Checks that a pull request title follows Conventional Commits, because squash merges use it as the commit message that drives versions and changelogs.

inputs:
    title:
        description: 'The pull request title, such as "feat(ui): add a settings modal".'
        required: true

runs:
    using: composite
    steps:
        - name: 🔎 Check Pull Request Title
          shell: bash
          env:
              PULL_REQUEST_TITLE: ${{ inputs.title }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/check_pull_request_title.sh"
              "${{ github.action_path }}/scripts/check_pull_request_title.sh"
