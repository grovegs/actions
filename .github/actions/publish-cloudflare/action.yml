name: Publish to Cloudflare
description: Deploy a static site directory to Cloudflare Pages using Wrangler.

inputs:
    directory:
        description: Path to the directory containing the static site files to deploy
        required: true
    project-name:
        description: The Cloudflare Pages project name
        required: true
    branch:
        description: The branch name of the deployment. The project's production branch updates production, any other branch creates a preview deployment with a branch alias.
        required: true
    api-token:
        description: Cloudflare API token with the Cloudflare Pages Edit permission
        required: true
    account-id:
        description: The Cloudflare account ID that owns the Pages project
        required: true
    wrangler-version:
        description: Wrangler version to run such as 4.42.0. If not specified, runs the latest version.
        required: false
        default: latest

outputs:
    deployment-url:
        description: The unique URL of this deployment
        value: ${{ steps.deploy-pages.outputs.deployment-url }}
    alias-url:
        description: The branch alias URL of this deployment such as https://develop.project.pages.dev
        value: ${{ steps.deploy-pages.outputs.alias-url }}
    environment:
        description: The Cloudflare Pages environment of this deployment, either production or preview
        value: ${{ steps.deploy-pages.outputs.environment }}

runs:
    using: composite
    steps:
        - name: 🚀 Deploy to Cloudflare Pages
          id: deploy-pages
          shell: bash
          env:
              DIRECTORY: ${{ inputs.directory }}
              PROJECT_NAME: ${{ inputs.project-name }}
              BRANCH: ${{ inputs.branch }}
              CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
              CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
              WRANGLER_VERSION: ${{ inputs.wrangler-version }}
          run: |
              chmod +x "${{ github.action_path }}/scripts/deploy_pages.sh"
              "${{ github.action_path }}/scripts/deploy_pages.sh"
